appId: ai.marswave.teyoo
productName: Teyoo
copyright: Copyright © 2024-2026 marswave.ai

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  # All runtime JavaScript is bundled by electron-vite. Do not let
  # electron-builder copy the complete production dependency tree into app.asar.
  - '!node_modules/**/*'
  # ...with one exception: @napi-rs/canvas is a native module (the Skia .node
  # binary), so rollup cannot bundle it and the main process requires it from
  # node_modules at runtime (see the `external` list in electron.vite.config.ts).
  # Dropping it broke "docx转md" in installed builds: the WMF/EMF branch of
  # docx-import.js died with `Cannot find module '@napi-rs/canvas'`.
  # The wildcard also picks up the platform binary package
  # (@napi-rs/canvas-win32-x64-msvc / -darwin-arm64 / -linux-x64-gnu …) that
  # @napi-rs/canvas loads internally. ~37 MB unpacked, mostly Skia.
  - 'node_modules/@napi-rs/**/*'
  # LaTeX公式（本地 Texo 模型）主进程推理：transformers.js 走 onnxruntime-node
  # 原生后端（electron.vite 里 external），运行时从 node_modules 加载。
  - 'node_modules/@huggingface/**/*'
  - 'node_modules/onnxruntime-node/**/*'
  - 'node_modules/onnxruntime-common/**/*'
  - 'node_modules/global-agent/**/*'
  # 公式识别历史（SQLite）：better-sqlite3 是原生模块，主进程 require，
  # 运行时从 node_modules 加载（原因同 @napi-rs/canvas）。只带运行时真正
  # 需要的 lib + 预编译 .node：随包的 src/*.cpp 与 build/ 中间产物纯属累赘。
  - 'node_modules/better-sqlite3/lib/**/*'
  - 'node_modules/better-sqlite3/prebuilds/**/*.node'
  - 'node_modules/better-sqlite3/package.json'
  # transformers.js 的 Node 构建是「顶层静态」import sharp（dist/transformers.node.mjs
  # 第 18834 行 `import sharp from "sharp"`，不是 try/catch 包着的动态 import），
  # 所以 sharp 不是可选依赖：模块一加载就要解析它，缺包直接 ERR_MODULE_NOT_FOUND，
  # 公式识别报 "Cannot find package 'sharp'"。
  # dev 下不报错只因 node_modules 里有；装到 Program Files 后 Node 向上查找
  # 够不到任何 node_modules，必炸。故随包带上：sharp 主包 + 它的运行时依赖，
  # 平台二进制只取当前平台（@img/sharp-win32-x64 单个就 19MB，含 libvips，
  # 若用 @img/** 会把 8 个平台全塞进安装包）。
  - 'node_modules/sharp/**/*'
  - 'node_modules/@img/sharp-${platform}-${arch}/**/*'
  - 'node_modules/@img/colour/**/*'
  - 'node_modules/detect-libc/**/*'
  - 'node_modules/semver/**/*'

# Native .node files cannot be dlopen'd from inside an asar archive, so keep
# the automatic unpacking heuristics off but unpack exactly the native modules
# we ship: Electron resolves them from app.asar.unpacked.
asar:
  smartUnpack: false

asarUnpack:
  - node_modules/@napi-rs/**/*
  - node_modules/onnxruntime-node/**/*
  - node_modules/better-sqlite3/**/*
  # sharp 的 .node 与它依赖的 libvips-42.dll 必须一起解包：.node 内部按相对
  # 路径 LoadLibrary 这个 dll，留在 asar 里 Windows 加载不到。
  - node_modules/@img/sharp-${platform}-${arch}/**/*

# ColaMD provides its own Chinese/English UI and only needs these Chromium
# locale resources. Keeping every Electron locale adds tens of megabytes.
# Electron uses hyphens on Linux and underscores in macOS .lproj names.
electronLanguages:
  - en-US
  - en_US
  - zh-CN
  - zh_CN

extraResources:
  - from: resources/templates
    to: templates
  - from: resources/demo
    to: demo
  # Texo 公式识别模型（2 个 ONNX + tokenizer/config，约 80MB）：主进程用
  # onnxruntime-node 直接读（见 main/texo-ocr.ts），不参与 asar 打包。
  - from: resources/texo
    to: texo
  # docx转md 的 PDF 预览：doc2pdf.exe 用 COM 调本机 Word 把 .docx 转成 PDF。
  # 打包后运行时从 process.resourcesPath/bin 取（见 main/docx-convert.ts）；
  # 开发期直接读仓库里的 resources/bin。
  - from: resources/bin
    to: bin
  # 转换器作者给的 Electron 集成参考（converter-service.js / example-main.js）。
  # 运行时不加载，随包只为排查问题时能对照原始实现。
  - from: resources/word2pdf2image
    to: word2pdf2image

npmArgs:
  - "--loglevel=error"

afterPack: ./scripts/afterPack.js

fileAssociations:
  - ext: md
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: markdown
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: txt
    name: Text Document
    role: Editor
    mimeType: text/plain

mac:
  compression: maximum
  # Publish separate installers for each CPU architecture instead of a
  # universal binary. This keeps both Intel and Apple Silicon support while
  # avoiding the duplicated Electron framework in every download.
  artifactName: '${productName}-${version}-${arch}.${ext}'
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true

win:
  # Artifact names must stay distinct from the mac ones: the mac zips are
  # ColaMD-<version>-<arch>.zip, so a plain win zip would collide with the mac
  # x64 zip in the release assets.
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  target:
    - nsis
    # Green build: unzip anywhere and run, nothing to install. No file
    # association, no Start Menu entry and no in-app updates, by design.
    - zip
  icon: resources/icon.png

linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: resources/icon.png

nsis:
  # No spaces: the default "${productName} Setup ${version}.exe" gets sanitized
  # two different ways (latest.yml: space -> "-", GitHub asset: space -> "."),
  # so the updater requested a filename that never existed on the release
  # (ColaMD-Setup-2.0.0.exe vs ColaMD.Setup.2.0.0.exe) and every in-app update
  # on Windows failed with a silent 404 (#56).
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: xxoolqq
  repo: teyoo
