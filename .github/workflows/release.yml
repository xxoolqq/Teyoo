name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Windows only: Teyoo 7.x is a Windows-first line, so the macOS and Linux jobs
# (code signing, notarization, AppImage/deb) were removed along with their
# secrets. Re-add them here and in electron-builder.yml if that changes.
jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci, not npm install: package-lock.json is committed and the native
      # packages (@napi-rs/canvas, onnxruntime-node, sharp, better-sqlite3) are
      # resolved from it. A floating install could pick a different platform
      # binary than the one electron-builder.yml whitelists.
      - run: npm ci

      # `npm run build` runs prebuild → typecheck first, so a type error fails
      # the release instead of shipping a broken bundle.
      - run: npm run build

      - name: Build distributables
        run: npx electron-builder --win --publish never

      # latest.yml + the .blockmap are what electron-updater reads; if they are
      # missing the release installs but never updates. Hence error, not ignore.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-win
          path: |
            release/*.exe
            release/*.zip
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

  # Tag pushes publish a release; manual dispatches are build-only so the
  # artifacts can be verified (or attached manually) before publishing.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The version's section in resources/demo/changelog.md is what users
      # read in the app, so it is also what they read on the release page.
      # GitHub's generated notes only ever listed merge commits.
      - name: Take the release notes from the changelog
        id: notes
        run: |
          set -euo pipefail
          awk -v v="${GITHUB_REF_NAME#v}" '
            BEGIN { target = "## v" v }
            index($0, target) == 1 { found = 1; print; next }
            found && /^## / { exit }
            found { print }
          ' resources/demo/changelog.md > "$RUNNER_TEMP/notes.md"
          # The section below ours is the previous release, so the changelog
          # alone gives the compare range: no need to fetch the tags.
          PREVIOUS=$(awk -v v="${GITHUB_REF_NAME#v}" '
            BEGIN { target = "## v" v }
            index($0, target) == 1 { found = 1; next }
            found && /^## v/ { print substr($2, 2); exit }
          ' resources/demo/changelog.md)
          if [ -s "$RUNNER_TEMP/notes.md" ] && [ -n "$PREVIOUS" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/v%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREVIOUS" "$GITHUB_REF_NAME" >> "$RUNNER_TEMP/notes.md"
          fi
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release notes::resources/demo/changelog.md has no section for ${GITHUB_REF_NAME}; publishing with generated notes"
          fi

      - name: Publish with the changelog section
        if: steps.notes.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: ${{ runner.temp }}/notes.md

      # A missing section still publishes, so a typo in the version number
      # cannot leave a tagged release unpublished. The warning above is the
      # signal to add the missing section.
      - name: Publish with generated notes
        if: steps.notes.outputs.found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
