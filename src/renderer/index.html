<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- worker-src：pdf.js 的 worker 走 ?url 资产（同源）；blob: 留给兼容性回退路径。
       font-src 加 blob:：pdf.js 用 FontFace 注入 PDF 内嵌字体时可能是 blob URL。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data: blob:; img-src 'self' data: blob: https: http: file:;">
  <title>Teyoo</title>
  <!-- Keep the titlebar stable before the renderer CSS bundle loads. -->
  <style>
    #titlebar { height: 40px; display: flex; align-items: center; padding: 0 6px 0 96px; position: relative; z-index: 30; -webkit-app-region: drag; }
    /* macOS hides the traffic lights in full screen, and Windows and Linux never
       had any: the 96px clearance goes with them. */
    body.fullscreen #titlebar, body.platform-non-mac #titlebar { padding-left: 6px; }
    /* Windows draws the window controls inside this row (titleBarOverlay), so the
       row keeps their width clear; env() reports it, 138px is the Windows 11
       control cluster when the variable is unavailable. */
    body.platform-win #titlebar { padding-right: calc(100vw - env(titlebar-area-width, calc(100vw - 138px)) + 6px); }
    #titlebar > button { flex: none; position: relative; margin-left: 8px; -webkit-app-region: no-drag; border: 0; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; }
    #titlebar > button[hidden] { display: none; }
    #word-count, #source-toggle-btn, #file-toggle-btn { width: 28px; height: 28px; }
    #save-status { flex: none; margin-right: 2px; white-space: nowrap; font-size: 11px; line-height: 1.3; opacity: 0; pointer-events: none; }
    .toolbar-tip { position: absolute; opacity: 0; pointer-events: none; }
    #file-panel { width: var(--file-panel-width, 220px); }
    #panel-resizer { position: fixed; top: calc(40px + var(--tab-bar-height, 0px)); bottom: 0; right: calc(var(--file-panel-width, 220px) - 4px); width: 7px; cursor: col-resize; z-index: 6; background: transparent; }
    #source-editor { display: none; }
    /* 样式 bundle 加载前的首帧兜底：下面几块全靠 CSS 隐藏，不兜底就会裸着
       露出来（doc-bar 只在 PDF 对照窗口出现，两个「勾」只在操作成功时出现）。
       这些规则写在 bundle 之前，bundle 里同名的会覆盖它们。 */
    #doc-bar { display: none; }
    #doc-json { display: none; }
    .doc-save-check { display: none; }
    .doc-copy-check { display: none; }
  </style>
</head>
<body>
  <div id="titlebar">
    <!-- Typora 式顶部菜单栏：Windows/Linux 显示一行一级标签，点击在标签下方
         弹出原生二级菜单。macOS 使用系统菜单栏，此条保持隐藏。 -->
    <div id="app-menubar" role="menubar" aria-label="Application menu" hidden>
      <button class="menubar-item" type="button" role="menuitem" data-menu="file">文件</button>
      <button class="menubar-item" type="button" role="menuitem" data-menu="edit">编辑</button>
      <button class="menubar-item" type="button" role="menuitem" data-menu="format">格式</button>
      <button class="menubar-item" type="button" role="menuitem" data-menu="insert">插入</button>
      <button class="menubar-item" type="button" role="menuitem" data-menu="font">字体</button>
      <button class="menubar-item" type="button" role="menuitem" data-menu="fontSize">字号</button>
      <button class="menubar-item" type="button" role="menuitem" data-menu="view">视图</button>
      <button class="menubar-item" type="button" role="menuitem" data-menu="theme">主题</button>
      <button class="menubar-item" type="button" role="menuitem" data-menu="print">打印</button>
      <button class="menubar-item" type="button" role="menuitem" data-menu="help">帮助</button>
    </div>
    <div id="tab-bar" hidden></div>
    <span id="save-status" aria-live="polite"></span>
    <button id="file-toggle-btn" aria-label="显示 / 隐藏文件列表">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/>
        <line x1="10.7" y1="3" x2="10.7" y2="13"/>
      </svg>
      <span class="toolbar-tip">显示 / 隐藏文件列表 (⌘\)</span>
    </button>
    <button id="source-toggle-btn" aria-label="切换 Markdown 源码 / 所见即所得">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="5.5 4.5 2 8 5.5 11.5"/>
        <polyline points="10.5 4.5 14 8 10.5 11.5"/>
      </svg>
      <span class="toolbar-tip">切换 Markdown 源码 / 所见即所得</span>
    </button>
    <button id="word-count" aria-label="文档统计">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/>
        <line x1="4.5" y1="6" x2="11.5" y2="6"/>
        <line x1="4.5" y1="9" x2="9.5" y2="9"/>
      </svg>
      <span class="toolbar-tip word-count-tip">0 字 · 0 词 · 0 段</span>
    </button>
  </div>
  <!-- Typora 式第二行工具条：历史 / 段落 / 行内格式 / 列表 / 插入。
       源码模式下隐藏；可见性偏好由 toolbar.ts 控制。 -->
  <div id="toolbar" role="toolbar" aria-label="格式工具栏" hidden>
    <div class="toolbar-group">
      <button type="button" class="toolbar-btn" data-tb-cmd="undo" title="撤销 (Ctrl+Z)">

        </svg>
      </button>
      <button type="button" class="toolbar-btn" data-tb-cmd="redo" title="重做 (Ctrl+Shift+Z)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 7v6h-6"/>
          <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/>
        </svg>
      </button>
    </div>
    <span class="toolbar-sep" aria-hidden="true"></span>
    <div class="toolbar-group">
      <div class="heading-dropdown" id="heading-dropdown">
        <button type="button" id="heading-select-btn" class="toolbar-btn heading-select-btn" aria-haspopup="true" aria-expanded="false" title="标题大小">
          <span id="heading-select-label">标题</span>
        </button>
        <div id="heading-menu" class="heading-menu" role="menu" hidden>
          <button type="button" role="menuitem" class="heading-menu-item" data-block="paragraph">正文</button>
          <button type="button" role="menuitem" class="heading-menu-item" data-block="heading1">标题 1</button>
          <button type="button" role="menuitem" class="heading-menu-item" data-block="heading2">标题 2</button>
          <button type="button" role="menuitem" class="heading-menu-item" data-block="heading3">标题 3</button>
          <button type="button" role="menuitem" class="heading-menu-item" data-block="heading4">标题 4</button>
          <button type="button" role="menuitem" class="heading-menu-item" data-block="heading5">标题 5</button>
          <button type="button" role="menuitem" class="heading-menu-item" data-block="heading6">标题 6</button>
        </div>
      </div>
      <div class="heading-dropdown" id="font-dropdown">
        <!-- 字体 / 字号下拉用图标（与 WebView2 宿主页同一份图标），fill 走
             currentColor 跟随主题。原来的 <span id="…-label"> 去掉：toolbar.ts

             当前字体/字号，想恢复把 span 加回来即可，JS 仍会往里写当前值。 -->
        <button type="button" id="font-select-btn" class="toolbar-btn heading-select-btn font-select-btn" aria-haspopup="true" aria-expanded="false" title="字体">
          <svg width="16" height="16" viewBox="0 0 1024 1024" fill="currentColor" aria-hidden="true">

          <button type="button" role="menuitem" class="font-menu-item" data-family="Noto Serif SC" style="font-family: 'Noto Serif SC', serif">思源宋体</button>
          <button type="button" role="menuitem" class="font-menu-item" data-family="Noto Sans SC" style="font-family: 'Noto Sans SC', sans-serif">思源黑体</button>
          <button type="button" role="menuitem" class="font-menu-item" data-family="LXGW WenKai" style="font-family: 'LXGW WenKai', serif">霞鹜文楷</button>
          <div class="dropdown-sep" role="separator"></div>
          <button type="button" role="menuitem" class="font-menu-item" data-family="Times New Roman" style="font-family: 'Times New Roman', serif">Times New Roman</button>
          <button type="button" role="menuitem" class="font-menu-item" data-family="Arial" style="font-family: Arial, sans-serif">Arial</button>
          <button type="button" role="menuitem" class="font-menu-item" data-family="Courier New" style="font-family: 'Courier New', monospace">Courier New</button>
          <button type="button" role="menuitem" class="font-menu-item" data-family="STIX Two Math" style="font-family: 'STIX Two Math', serif">STIX Two Math</button>
        </div>
      </div>
      <div class="heading-dropdown" id="fontsize-dropdown">

      <button type="button" class="toolbar-btn tb-text" data-tb-cmd="underline" title="下划线 (Ctrl+U)"><u>U</u></button>
      <button type="button" class="toolbar-btn tb-text" data-tb-cmd="strikethrough" title="删除线 (Ctrl+Shift+X)"><span class="tb-strike">S</span></button>
      <button type="button" class="toolbar-btn" data-tb-cmd="emphDot" title="字下着重号（@.文字.@）">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <line x1="3" y1="5" x2="8" y2="5"/>
          <line x1="3" y1="8.5" x2="10.5" y2="8.5"/>
          <circle cx="3.6" cy="12.3" r="1.05" fill="currentColor" stroke="none"/>
          <circle cx="6.9" cy="12.3" r="1.05" fill="currentColor" stroke="none"/>
          <circle cx="10.2" cy="12.3" r="1.05" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button type="button" class="toolbar-btn" data-tb-cmd="subscript" title="下标（_{x}）">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <text x="1.5" y="13" font-size="11" font-weight="600" fill="currentColor" font-style="italic">x</text>
          <text x="9.5" y="15" font-size="7.5" font-weight="600" fill="currentColor">2</text>
        </svg>
      </button>
      <button type="button" class="toolbar-btn" data-tb-cmd="superscript" title="上标（^{x}）">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <text x="1.5" y="13" font-size="11" font-weight="600" fill="currentColor" font-style="italic">x</text>
          <text x="9.5" y="8.5" font-size="7.5" font-weight="600" fill="currentColor">2</text>
        </svg>
      </button>
      <button type="button" class="toolbar-btn" data-tb-cmd="inlineCode" title="行内代码 (Ctrl+E)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 4.5 2.5 8 6 11.5"/>
          <polyline points="10 4.5 13.5 8 10 11.5"/>
        </svg>
      </button>
      <button type="button" class="toolbar-btn" data-tb-cmd="link" title="链接 (Ctrl+K)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.8 9.2a2.6 2.6 0 0 0 3.7.3l1.2-1.2a2.6 2.6 0 0 0-3.7-3.7L7.1 5.5"/>
          <path d="M9.2 6.8a2.6 2.6 0 0 0-3.7-.3l-1.2 1.2a2.6 2.6 0 0 0 3.7 3.7l.9-.9"/>
        </svg>
      </button>
    </div>
    <span class="toolbar-sep" aria-hidden="true"></span>
    <div class="toolbar-group">
      <button type="button" class="toolbar-btn" data-tb-cmd="longBlank" title="插入长空白（10 个全角空格）">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 6H5v12h4"/>
          <path d="M15 6h4v12h-4"/>
        </svg>
      </button>
      <button type="button" class="toolbar-btn" data-tb-cmd="longUnderscore" title="插入长下划线（填空线）">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="8" x2="6" y2="13"/>
          <line x1="12" y1="8" x2="12" y2="13"/>
          <line x1="18" y1="8" x2="18" y2="13"/>
          <line x1="3" y1="17" x2="21" y2="17"/>
        </svg>
      </button>
      <button type="button" class="toolbar-btn" data-tb-cmd="circledSup" title="汉字右上角带圈序号（光标置于汉字后）">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <text x="5" y="18" font-size="15" fill="currentColor" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">字</text>
          <circle cx="18" cy="5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <text x="18" y="6.8" text-anchor="middle" font-size="5" fill="currentColor" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">1</text>
        </svg>
      </button>
      <button type="button" class="toolbar-btn tb-text" data-tb-cmd="pinyin" title="汉字拼音（上方 / 同行）"><b>P</b></button>
      <div class="symbol-dropdown">
        <button type="button" class="toolbar-btn tb-omega" data-tb-cmd="symbol" aria-haspopup="true" aria-expanded="false" title="插入符号">
          <span>Ω</span>
        </button>
        <div id="symbol-menu" class="symbol-menu" role="menu" hidden></div>
      </div>
    </div>
    <span class="toolbar-sep" aria-hidden="true"></span>
    <div class="toolbar-group">
      <button type="button" class="toolbar-btn" data-tb-cmd="bulletList" title="无序列表 (Ctrl+Shift+8)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <line x1="5.5" y1="4" x2="13.5" y2="4"/>
          <line x1="5.5" y1="8" x2="13.5" y2="8"/>
          <line x1="5.5" y1="12" x2="13.5" y2="12"/>
          <circle cx="3" cy="4" r="1" fill="currentColor" stroke="none"/>
          <circle cx="3" cy="8" r="1" fill="currentColor" stroke="none"/>
          <circle cx="3" cy="12" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button type="button" class="toolbar-btn" data-tb-cmd="orderedList" title="有序列表 (Ctrl+Shift+7)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <line x1="5.5" y1="4" x2="13.5" y2="4"/>
          <line x1="5.5" y1="8" x2="13.5" y2="8"/>
          <line x1="5.5" y1="12" x2="13.5" y2="12"/>
          <text x="1.4" y="5.9" font-size="5.6" fill="currentColor" stroke="none" font-family="sans-serif">1</text>
          <text x="1.4" y="9.9" font-size="5.6" fill="currentColor" stroke="none" font-family="sans-serif">2</text>
          <text x="1.4" y="13.9" font-size="5.6" fill="currentColor" stroke="none" font-family="sans-serif">3</text>
        </svg>
      </button>
      <button type="button" class="toolbar-btn" data-tb-cmd="taskList" title="任务列表">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2.5" width="5" height="5" rx="1"/>
          <polyline points="3.2 5 4.5 6.3 6.1 3.9"/>
          <line x1="9" y1="5" x2="14" y2="5"/>
          <rect x="2" y="8.5" width="5" height="5" rx="1"/>
          <line x1="9" y1="11" x2="14" y2="11"/>
        </svg>
      </button>
    </div>
    <span class="toolbar-sep" aria-hidden="true"></span>
    <div class="toolbar-group">
      <button type="button" class="toolbar-btn" data-tb-cmd="math" title="公式 (Ctrl+Shift+E)">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <text x="8" y="15" text-anchor="middle" font-size="16" fill="currentColor" font-family="Georgia,'Times New Roman',serif" font-style="italic">∑</text>
        </svg>
      </button>
      <button type="button" class="toolbar-btn" data-tb-cmd="image" title="插入图片">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <circle cx="9" cy="10" r="2"/>
          <path d="M3 17l5-5 4 4 3-3 6 6"/>
        </svg>
      </button>
      <button type="button" class="toolbar-btn" data-tb-cmd="subblock" title="子块（带边框/对齐）">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="1" />
          <line x1="3" y1="10" x2="21" y2="10" />
          <text x="12" y="8" text-anchor="middle" font-size="3.5" fill="currentColor" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">text</text>
        </svg>
      </button>
      <button type="button" class="toolbar-btn" data-tb-cmd="cols" title="分栏（N 列等宽或 A:B 比例）">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="1" />
          <line x1="12" y1="4" x2="12" y2="20" />
        </svg>
      </button>
      <button type="button" class="toolbar-btn" data-tb-cmd="tianzi" title="汉字田字格（纯汉字 / 空白格 / 带拼音）">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="1" />
          <line x1="3" y1="12" x2="21" y2="12" stroke-dasharray="2 2"/>
          <line x1="12" y1="3" x2="12" y2="21" stroke-dasharray="2 2"/>
        </svg>
      </button>
      <button type="button" class="toolbar-btn" data-tb-cmd="table" title="插入表格">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="16" height="14" rx="1"/>
          <line x1="2" y1="8" x2="18" y2="8"/>
          <line x1="2" y1="13" x2="18" y2="13"/>
          <line x1="8" y1="3" x2="8" y2="17"/>
          <line x1="13" y1="3" x2="13" y2="17"/>
        </svg>
      </button>
    </div>
  </div>
  <aside id="file-panel" hidden>
    <div class="file-panel-tabs" role="tablist" aria-label="侧栏内容">
      <button id="file-panel-files" class="active" type="button" role="tab" aria-selected="true">文件</button>
      <button id="file-panel-outline" type="button" role="tab" aria-selected="false">大纲</button>
    </div>
    <ul id="file-list"></ul>
    <ul id="outline-list" hidden></ul>
  </aside>
  <div id="panel-resizer" aria-hidden="true"></div>
  <!-- PDF 对照视图（菜单「文件 → PDF转md」开的标签页）：左侧源文件，右侧编辑器。
       默认隐藏，pdf-view.ts 在切进该标签页时显示它、切走时收起。 -->
  <aside id="pdf-panel" aria-label="PDF 源文件" hidden>
    <div class="pdf-panel-head">
      <span class="pdf-panel-title">源文件</span>
      <span id="pdf-source-name" class="pdf-source-name"></span>
      <!-- 缩放：⊖ ⊕ + 当前比例，放在页码左侧 -->
      <span class="pdf-zoom">
        <button id="pdf-zoom-out" class="pdf-zoom-btn" type="button">⊖</button>
        <button id="pdf-zoom-in" class="pdf-zoom-btn" type="button">⊕</button>
        <span id="pdf-zoom-level" class="pdf-zoom-level">100%</span>
      </span>
      <span id="pdf-meta" class="pdf-meta"></span>
      <!-- 在线解析：调 MinerU 精准解析 API（主进程 src/main/http/mineru.ts）。
           选中 PDF 后才露出来（没源文件就没有可解析的东西）。 -->
      <button id="pdf-parse-btn" class="pdf-parse-btn" type="button" hidden>在线解析</button>
    </div>
    <div id="pdf-pages" class="pdf-pages"></div>
    <!-- 空态：菜单「PDF转md」开出来的标签页还没选源文件。选中后 pdf-view.ts
         把它藏起来换成上面的页面栏（与 JSON 视图的空态同一个套路）。 -->
    <div id="pdf-empty" class="pdf-empty" hidden>
      <p id="pdf-empty-text" class="pdf-empty-text"></p>
      <button id="pdf-open-btn" class="pdf-open-btn" type="button">打开 PDF…</button>
    </div>
  </aside>
  <div id="pdf-resizer" aria-hidden="true" hidden></div>
  <!-- 右侧栏顶部条：文档格式切换 + 保存 + 复制当前内容。只在 PDF 对照标签页显示
       （base.css 的 body.pdf-view），普通标签页那一行是标签条 + 格式工具栏。 -->
  <div id="doc-bar">
    <div class="doc-mode-switch" role="group" aria-label="文档格式">
      <button id="doc-mode-markdown" class="doc-mode-btn is-active" type="button" aria-pressed="true">Markdown</button>
      <button id="doc-mode-json" class="doc-mode-btn" type="button" aria-pressed="false">JSON</button>
    </div>
    <!-- 保存（在复制按钮左侧）：和 Ctrl+S 同一条路径；未命名的文档才弹框，
         默认落在偏好里的工作目录。 -->
    <button id="doc-save-btn" class="doc-save-btn" type="button">
      <svg class="doc-save-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M2.75 2.75h10.5v10.5H2.75z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M5.5 2.75h5v4h-5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M5.5 9.5h5v3.75h-5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
      <svg class="doc-save-check" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <polyline points="3 8.5 6.5 12 13 4.5" fill="none" stroke="currentColor"
                  stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="doc-copy-btn" class="doc-copy-btn" type="button">
      <svg class="doc-copy-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M10.5 5.5v-1a2 2 0 0 0-2-2h-4.5a2 2 0 0 0-2 2v4.5a2 2 0 0 0 2 2h1"
              fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <rect class="doc-copy-front" x="5.5" y="5.5" width="8.5" height="8.5" rx="2"
              stroke="currentColor" stroke-width="1.3"/>
      </svg>
      <svg class="doc-copy-check" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <polyline points="3 8.5 6.5 12 13 4.5" fill="none" stroke="currentColor"
                  stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <div id="editor"></div>
  <textarea id="source-editor" spellcheck="false"></textarea>
  <!-- JSON 模式：只读展示解析结果（MinerU 的 layout.json 之类）。缩进、着色、
       折叠和「只画可视区」都在 json-view.ts 里做，这里只给两个容器：
       树（虚拟滚动）和空态（没有 JSON 时的「打开 JSON…」）。 -->
  <div id="doc-json">
    <div id="json-viewport" class="json-viewport">
      <div id="json-lines" class="json-lines"></div>
    </div>
    <div id="json-empty" class="json-empty">
      <p id="json-empty-text" class="json-empty-text"></p>
      <button id="json-open-btn" class="json-open-btn" type="button">打开 JSON…</button>
    </div>
  </div>
  <!-- 提交标签页：非编辑器的表单视图（输入框 + 提交按钮），由 main.ts
       在「提交」标签页激活时显示。整页铺满编辑区：左侧表单列、右侧预览区
       （主编辑器 #editor 的 DOM 被移入此处，只读渲染输入内容）。 -->
  <div id="submit-panel" hidden>
    <div class="submit-form">
      <textarea id="submit-input" autocomplete="off" spellcheck="false"
                aria-label="提交内容"></textarea>
      <textarea id="submit-input-secondary" autocomplete="off" spellcheck="false"
                aria-label="附加内容"></textarea>
      <button id="submit-btn" type="button">提交</button>
      <p id="submit-feedback" aria-live="polite"></p>
    </div>
    <div id="submit-preview"></div>
  </div>
  <!-- 打印预览：Electron 的打印对话框自带的预览区在 Electron 里永远是
       「此应用不支持打印预览」（Chromium 的预览渲染器没实现），所以预览由应用
       自己画：主进程按打印样式 printToPDF，这里用 pdf.js 铺成页面（见
       print-preview.ts）。整层盖住编辑区，页面栏自己滚动。 -->
  <div id="print-preview" hidden>
    <div class="print-preview-bar">
      <span class="print-preview-title">打印预览</span>
      <span id="print-preview-meta" class="print-preview-meta"></span>
      <button id="print-preview-do" class="print-preview-btn is-primary" type="button">打印</button>
      <button id="print-preview-close" class="print-preview-btn" type="button">关闭</button>
    </div>
    <div id="print-preview-pages" class="print-preview-pages"></div>
  </div>
  <div id="update-banner" hidden>
    <span id="update-banner-text">发现新版本</span>
    <button id="update-banner-action" type="button">更新</button>
    <button id="update-banner-dismiss" type="button" aria-label="关闭">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/>
      </svg>
    </button>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
